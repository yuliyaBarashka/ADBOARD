{% extends "base.html" %}
{% block title %}Удалить объявление{% endblock %}

{% block content %}
<h1>Удалить объявление?</h1>
<p>Вы уверены, что хотите удалить <strong>{{ ad.title }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'web:ad-detail' ad.pk %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
