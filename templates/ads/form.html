{% extends "base.html" %}
{% block title %}{{ action }} объявление{% endblock %}

{% block content %}
<h1>{{ action }} объявление</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary">{{ action }}</button>
    <a href="{% url 'web:ad-list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
