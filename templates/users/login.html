{% extends "base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1>Вход</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary w-100">Войти</button>
        </form>
        <p class="mt-3">Нет аккаунта? <a href="{% url 'web:register' %}">Регистрация</a></p>
    </div>
</div>
{% endblock %}
